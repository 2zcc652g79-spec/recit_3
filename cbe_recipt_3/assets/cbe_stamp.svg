<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <!-- Top Arc for Amharic Text -->
    <path id="stampAmharicArc" d="M 32 130 A 98 98 0 0 1 228 130" fill="none" />
    <!-- Bottom Arc for English Text -->
    <path id="stampEnglishArc" d="M 228 130 A 98 98 0 0 1 32 130" fill="none" />
    
    <!-- CBE Spiral Emblem in Stamp Ink Color -->
    <linearGradient id="stampInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a125a" />
      <stop offset="100%" stop-color="#6e166e" />
    </linearGradient>
  </defs>

  <!-- Outer Dotted Stamp Ring -->
  <circle cx="130" cy="130" r="120" fill="none" stroke="#601460" stroke-width="3" stroke-dasharray="7 3.5" opacity="0.9" />
  
  <!-- Outer Solid Thin Ring -->
  <circle cx="130" cy="130" r="112" fill="none" stroke="#601460" stroke-width="1.8" opacity="0.85" />
  
  <!-- Inner Ring separating text from center emblem -->
  <circle cx="130" cy="130" r="76" fill="none" stroke="#601460" stroke-width="2" stroke-dasharray="5 2.5" opacity="0.85" />
  <circle cx="130" cy="130" r="69" fill="none" stroke="#601460" stroke-width="1.2" opacity="0.8" />

  <!-- Top Curve: የኢትዮጵያ ንግድ ባንክ -->
  <text fill="#601460" font-size="16.5" font-weight="700" letter-spacing="3" font-family="'Noto Sans Ethiopic', 'Abyssinica SIL', sans-serif" opacity="0.92">
    <textPath href="#stampAmharicArc" startOffset="50%" text-anchor="middle">
      የኢትዮጵያ ንግድ ባንክ
    </textPath>
  </text>

  <!-- Bottom Curve: Commercial Bank of Ethiopia -->
  <text fill="#601460" font-size="10.8" font-weight="800" letter-spacing="1.5" font-family="'Inter', -apple-system, sans-serif" opacity="0.92">
    <textPath href="#stampEnglishArc" startOffset="50%" text-anchor="middle">
      Commercial Bank of Ethiopia
    </textPath>
  </text>

  <!-- Star & Branch/Version Code Accents -->
  <text x="24" y="135" fill="#601460" font-size="14" text-anchor="middle" opacity="0.9">★</text>
  <text x="236" y="135" fill="#601460" font-size="14" text-anchor="middle" opacity="0.9">★</text>
  <text x="202" y="172" fill="#601460" font-size="8.5" font-weight="700" opacity="0.85">19.1.6</text>

  <!-- Central CBE Spiral Guilloche Logo (As in Image 2) -->
  <g transform="translate(130, 130)" stroke="#601460" fill="none" opacity="0.88">
    <!-- Guilloche Spiral Petals -->
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(0)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(15)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(30)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(45)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(60)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(75)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(90)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(105)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(120)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(135)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(150)" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="36" ry="16" transform="rotate(165)" stroke-width="1.2" />

    <!-- Central core circle with CBE initials -->
    <circle cx="0" cy="0" r="18" fill="#601460" opacity="0.15" />
    <circle cx="0" cy="0" r="18" stroke="#601460" stroke-width="1.6" />
    <text x="0" y="5" fill="#601460" font-size="12" font-weight="900" text-anchor="middle" font-family="'Inter', sans-serif" letter-spacing="1">CBE</text>
  </g>
</svg>
